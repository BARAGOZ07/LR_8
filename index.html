<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Добро пожаловать!</h1>
    </header>

    <main>
        <h2>Главная страница</h2>
        <p>Нажмите на кнопку, чтобы оставить сообщение.</p>

        <button id="openFeedback" class="feedback-button">
            Обратная связь
        </button>
    </main>


    <!-- Попап -->

    <div class="feedback-overlay" id="feedbackPopup">

        <div class="feedback-window">

            <button class="feedback-close" id="closeFeedback">
                &times;
            </button>

            <h2>Обратная связь</h2>

            <form id="feedbackForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="fullname">ФИО</label>
                       
>

<!-- ФИО -->
<input
    type="text"
    name="fullname"
    placeholder="ФИО"
    required
>

<!-- Email -->
<input
    type="email"
    name="email"
    placeholder="Email"
    required
>

<!-- Телефон -->
<input
    type="tel"
    name="phone"
    placeholder="Телефон"
    required
    maxlength="11"
>

<!-- Организация -->
<input
    type="text"
    name="organization"
    placeholder="Организация"
    required
>
                    </div>

                </div>

                <div class="form-group">
                    <label for="message">Сообщение</label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Введите сообщение"
                        required></textarea>
                </div>

                <label class="consent">
                    <input
                        type="checkbox"
                        id="consent"
                        name="consent"
                        required>

                    <span>
                        Согласен на обработку персональных данных
                    </span>
                </label>

                <button type="submit" class="submit-button">
                    Отправить
                </button>

                <p id="formStatus" aria-live="polite"></p>

            </form>

        </div>

    </div>
    <script src="script.js"></script>

</body>
</html>
