```html
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Мой сайт</h1>
        <p>Добро пожаловать!</p>
    </header>

    <main>
        <h2>Главная страница</h2>
        <p>Нажмите на кнопку, чтобы оставить сообщение.</p>

        <button id="openFeedback" class="feedback-button">
            Обратная связь
        </button>
    </main>


    <!-- Попап -->

    <div class="feedback-overlay" id="feedbackPopup">

        <div class="feedback-window">

            <button class="feedback-close" id="closeFeedback">
                &times;
            </button>

            <h2>Обратная связь</h2>

            <form id="feedbackForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="fullname">ФИО</label>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Введите ФИО"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@mail.com"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="+7 (999) 123-45-67"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="organization">Организация</label>
                        <input
                            type="text"
                            id="organization"
                            name="organization"
                            placeholder="Название организации">
                    </div>

                </div>

                <div class="form-group">
                    <label for="message">Сообщение</label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Введите сообщение"
                        required></textarea>
                </div>

                <label class="consent">
                    <input
                        type="checkbox"
                        id="consent"
                        name="consent"
                        required>

                    <span>
                        Согласен на обработку персональных данных
                    </span>
                </label>

                <button type="submit" class="submit-button">
                    Отправить
                </button>

                <p id="formStatus" aria-live="polite"></p>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
